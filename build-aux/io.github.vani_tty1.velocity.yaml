id: io.github.vani_tty1.velocity
runtime: org.gnome.Platform
runtime-version: '51'
sdk: org.gnome.Sdk
command: velocity
finish-args:
  - --share=network
  - --share=ipc
  - --socket=fallback-x11
  - --device=dri
  - --socket=wayland
cleanup:
  - /include
  - /lib/pkgconfig
  - /man
  - /share/doc
  - /share/gtk-doc
  - /share/man
  - /share/pkgconfig
  - '*.la'
  - '*.a'
modules:
  - name: velocity
    builddir: true
    buildsystem: meson
    sources:
      - type: dir
        path: ..