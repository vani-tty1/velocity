id: io.github.vani_tty1.velocity.Devel
runtime: org.gnome.Platform
runtime-version: '51'
sdk: org.gnome.Sdk
command: velocity
finish-args:
  - --share=network
  - --share=ipc
  - --socket=fallback-x11
  - --device=dri
  - --socket=wayland
modules:
  - name: velocity
    builddir: true
    buildsystem: meson
    config-opts:
      - -Dprofile=development
    sources:
      - type: dir
        path: ..